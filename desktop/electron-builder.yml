appId: com.ambicrew.ambicrew
productName: AmbiCrew
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: ../.env
    to: .env
  - from: ../src/server
    to: server
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: public/app-icon.png
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: public/app-icon.png
  hardenedRuntime: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: public/app-icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
