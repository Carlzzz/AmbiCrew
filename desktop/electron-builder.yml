appId: com.ambicrew.ambicrew
productName: AmbiCrew
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: ../.env
    to: .env
  - from: resources/claude-sidecar.exe
    to: .
  - from: resources/claude-sidecar
    to: .
  - from: resources/adapter-sidecar.exe
    to: .
  - from: resources/adapter-sidecar
    to: .
  - from: resources/ripgrep
    to: ripgrep
  - from: resources/MinGit
    to: MinGit
  - from: resources/python
    to: python
  - from: ../runtime
    to: runtime
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: public/app-icon.png
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: public/app-icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Code signing requires Apple Developer credentials. Set via environment:
  #   APPLE_ID=your@email.com
  #   APPLE_APP_SPECIFIC_PASSWORD=xxxx-xxxx-xxxx-xxxx
  #   APPLE_TEAM_ID=XXXXXXXXXX
  # Or use a signing identity from your keychain:
  #   CSC_LINK=/path/to/cert.p12
  #   CSC_KEY_PASSWORD=password
  # For notarization (required for distribution outside App Store):
  #   Add APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID,
  #   then electron-builder will notarize automatically with notarize: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: public/app-icon.png
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
