appId: com.ambicrew.ambicrew
productName: AmbiCrew
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: public/app-icon.png
    to: app-icon.png
  - from: ../.env
    to: .env
  - from: resources/claude-sidecar.exe
    to: .
  - from: resources/claude-sidecar
    to: .
  - from: resources/MinGit
    to: MinGit
  - from: resources/python
    to: python
  - from: ../runtime
    to: runtime
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: public/app-icon.png
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: public/app-icon.png
  hardenedRuntime: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: public/app-icon.png
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
