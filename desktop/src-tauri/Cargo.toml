[package]
name = "ambicrew"
version = "3.2.4"
description = "AmbiCrew - Enterprise AI Development Environment"
authors = ["Ambilight"]
edition = "2021"

[lib]
name = "ambicrew_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
libloading = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
url = "2"
dotenvy = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(windows)'.dependencies]
# Used by commands::job_object to bind sidecar children to a Windows JobObject
# with KILL_ON_JOB_CLOSE — when the Tauri main process dies (even via task
# manager force-kill), the kernel terminates every sidecar child with it so
# they cannot orphan and leak the server port across launches.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
